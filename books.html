<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maadooyinka - Grade Hub</title>
    <!-- <link rel="stylesheet" href="css/style.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --theme-purple: #764ba2;
            --bg-light: #f8f9fa;
        }

        body {
            font-family: sans-serif;
            background: var(--bg-light);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .header-section {
            margin-bottom: 30px;
        }

        .header-section h1 {
            color: var(--theme-purple);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .book-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 4px solid var(--theme-purple);
        }

        .book-card:hover {
            transform: translateY(-5px);
        }

        .book-card i {
            font-size: 40px;
            color: var(--theme-purple);
            margin-bottom: 15px;
        }

        .btn-back {
            margin-top: 30px;
            padding: 10px 25px;
            background: var(--theme-purple);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header-section">
        <h1 id="gradeTitle">Maadooyinka</h1>
        <p>Dooro maadada aad rabto inaad akhriso buuggeeda</p>
    </div>

    <!-- Halkan waxaa ku soo dhacaya maadooyinka iskiis (Dynamic) -->
    <div class="books-grid" id="subjectsContainer"></div>

    <button onclick="window.location.href='dashboard.html'" class="btn-back">
        <i class="fas fa-arrow-left"></i> Dib u laabo Dashboard
    </button>

    <script>
        // 1. Hel fasalka uu ardaygu soo doortay
        const selectedGrade = localStorage.getItem('selectedGrade') || "8"; // Haddii kale Default waa 8
        document.getElementById('gradeTitle').innerText = `Maadooyinka Fasalka ${selectedGrade}`;

        // 2. Database-ka Maadooyinka (Tusaale ahaan)
        const subjectsData = {
            "6": [
                { name: "Tarbiyo", icon: "fa-mosque", file: "g6_tarbiyo.pdf" },
                { name: "Social Science", icon: "fa-users", file: "g6_social.pdf" },
                { name: "Science", icon: "fa-flask", file: "g6_science.pdf" },
                { name: "Xisaab", icon: "fas fa-calculator", file: "g6_xisaab" },
                { name: "English", icon: "fas fa-language", file: "g6_english" },
                { name: "Soomaali", icon: "fas fa-pen-nib", file: "g6_soomaali.pdf" },
                { name: "Carabi", icon: "fas fa-language", file: "g6_carabi.pdf" }
            ],
            "8": [
                { name: "Chemistry", icon: "fa-flask", file: "g8_chem.pdf" },
                { name: "Physics", icon: "fa-bolt", file: "g8_phys.pdf" },
                { name: "Math", icon: "fa-calculator", file: "g8_math.pdf" }
            ],
            "12": [
                { name: "Tarbiyo", icon: "fa-mosque", file: "g6_tarbiyo.pdf" },
                { name: "Carabi", icon: "fas fa-language", file: "g6_carabi.pdf" },
                { name: "Biology", icon: "fa-dna", file: "g12_bio.pdf" },
                { name: "Physics", icon: "fa-atom", file: "g12_phys.pdf" },
                { name: "Chemistry", icon: "fa-vial", file: "g12_chem.pdf" },
                { name: "Math", icon: "fa-calculator", file: "g12_math.pdf" },
                { name: "English", icon: "fa-book", file: "g12_eng.pdf" },
                { name: "Soomaali", icon: "fas fa-pen-nib", file: "g12_soomaali.pdf" }
            ]
            // Waxaad ku dari kartaa fasal kasta halkan...
        };

        // 3. Logic-ga soo bandhigista
        function loadSubjects() {
            const container = document.getElementById('subjectsContainer');
            const subjects = subjectsData[selectedGrade] || []; // Hel maadooyinka fasalkaas

            if (subjects.length === 0) {
                container.innerHTML = `<p>Wali laguma darin buugaagta fasalkan.</p>`;
                return;
            }

            subjects.forEach(sub => {
                const card = `
                    <div class="book-card" onclick="openBook('${sub.file}', '${sub.name}')">
                        <i class="fas ${sub.icon}"></i>
                        <h3>${sub.name}</h3>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function openBook(file, name) {
            // Halkan u dir bogga PDF viewer-ka
            window.location.href = `view-pdf.html?file=${file}&name=${name}`;
        }

        // Daari shaqada marka boggu kaco
        window.onload = loadSubjects;
    </script>
</body>

</html>
