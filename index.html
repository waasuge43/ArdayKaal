<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <title>Grade 8 Learning Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <i class="fas fa-user-graduate" style="font-size: 50px; color: var(--primary-green);"></i>
        <h2>Grade 8 Learning Hub</h2>
        <p>Geli macluumaadkaaga si aad u sii wadato</p>

        <form id="loginForm">
            <!-- ID-yada halkan aad u hubi -->
            <input type="text" id="loginName" placeholder="Magacaaga oo dhameestiran" required
                style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd;">

            <input type="password" id="loginPass" placeholder="Geli lambar sireedkaaga" required
                style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd;">

            <button type="submit" class="btn-primary">Gal System ka</button>
        </form>

        <div style="margin-top: 20px;">
            <a href="signup.html" style="color: #007bff; text-decoration: none; font-size: 14px; font-weight: bold;">
                Lambar sireed malihi (Is-diwaangeli)
            </a>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
