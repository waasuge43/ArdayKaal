<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dooro Fasalkaaga - Grade Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --theme-purple: #764ba2;
            --bg-light: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-light);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .class-container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .class-card {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 5px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .class-card:hover {
            transform: translateY(-10px);
            border-color: var(--theme-purple);
            background: var(--theme-purple);
            color: white;
        }

        .class-card i {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .class-card h3 {
            margin: 0;
        }

        @media (max-width: 600px) {
            .class-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="class-container">
        <h1 style="color: var(--theme-purple);">Dooro Fasalkaaga</h1>
        <p>Fadlan dooro fasalka aad dhigato si aad u hesho maadooyinkaaga.</p>

        <div class="class-grid">
            <!-- Fasalka 6 -->
            <div class="class-card" onclick="selectClass(6)">
                <i class="fas fa-graduation-cap"></i>
                <h3>Fasalka 6</h3>
            </div>
            <!-- Fasalka 7 -->
            <div class="class-card" onclick="selectClass(7)">
                <i class="fas fa-graduation-cap"></i>
                <h3>Fasalka 7</h3>
            </div>
            <!-- Fasalka 8 -->
            <div class="class-card" onclick="selectClass(8)">
                <i class="fas fa-graduation-cap"></i>
                <h3>Fasalka 8</h3>
            </div>
            <!-- Fasalka 9 -->
            <div class="class-card" onclick="selectClass(9)">
                <i class="fas fa-user-graduate"></i>
                <h3>Fasalka 9</h3>
            </div>
            <!-- Fasalka 10 -->
            <div class="class-card" onclick="selectClass(10)">
                <i class="fas fa-user-graduate"></i>
                <h3>Fasalka 10</h3>
            </div>
            <!-- Fasalka 11 -->
            <div class="class-card" onclick="selectClass(11)">
                <i class="fas fa-user-graduate"></i>
                <h3>Fasalka 11</h3>
            </div>
            <!-- Fasalka 12 -->
            <div class="class-card" onclick="selectClass(12)">
                <i class="fas fa-award"></i>
                <h3>Fasalka 12</h3>
            </div>
        </div>
    </div>

    <script>
        function selectClass(grade) {
            // Ku keydi fasalka la doortay localStorage
            localStorage.setItem('selectedGrade', grade);

            // U gudbi Dashboard-ka (kaas oo hadda tusi doona xogta fasalkaas)
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
