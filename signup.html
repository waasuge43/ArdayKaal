<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is-diwaangeli - Grade 8 Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <i class="fas fa-user-plus" style="font-size: 50px; color: var(--primary-green);"></i>
        <h2>Abuur Akoon Cusub</h2>

        <form id="signupForm">
            <input type="text" id="regName" placeholder="Magacaaga oo buuxa" required
                style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd;">

            <input type="password" id="regPass" placeholder="Abuur Lambar sireed" required
                style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ddd;">

            <button type="submit" class="btn-primary">Is-diwaangeli</button>
        </form>

        <p style="margin-top: 20px;">
            Hadda ayaad leedahay akoon? <a href="index.html"
                style="color: var(--primary-green); text-decoration: none;">Gal System-ka</a>
        </p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
