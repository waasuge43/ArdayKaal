<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is-diwaangeli - Grade 8 Hub</title>
    <!-- CSS Links -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- SweetAlert2 for beautiful alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-green: #28a745;
            --dark-gray: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile-upload {
            position: relative;
            margin: 20px auto;
            width: 100px;
            height: 100px;
        }

        .profile-upload img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-green);
        }

        .profile-upload .icon-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-green);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid white;
        }

        h2 {
            color: var(--dark-gray);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary-green);
            outline: none;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: #218838;
        }

        .login-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .login-link a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="profile-upload">
            <img id="preview" src="https://via.placeholder.com/100" alt="Profile">
            <label for="profilePic" class="icon-badge">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="profilePic" accept="image/*" style="display: none;" onchange="previewImage(event)">
        </div>

        <h2>Abuur Akoon Cusub</h2>

        <form id="signupForm">
            <div class="form-group">
                <label>Magacaaga oo buuxa</label>
                <input type="text" id="regName" placeholder="Tusaale: Maxamed Cali" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUser" placeholder="Tusaale: maxamed123" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Tusaale: user@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" placeholder="Tusaale: 061XXXXXXX" required>
            </div>

            <div class="form-group">
                <label>Gender (Jinsi)</label>
                <select id="regGender" required>
                    <option value="" disabled selected>Dooro...</option>
                    <option value="Lab">Lab (Male)</option>
                    <option value="Dheddig">Dheddig (Female)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lambar Sireed (Password)</label>
                <input type="password" id="regPass" placeholder="Abuur password adag" required>
            </div>

            <button type="submit" class="btn-primary">Is-diwaangeli</button>
        </form>

        <p class="login-link">
            Hadda ayaad leedahay akoon? <a href="index.html">Gal System-ka</a>
        </p>
    </div>

    <script>
        // Preview sawirka marka la soo doorto
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                const output = document.getElementById('preview');
                output.src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // SIGNUP LOGIC - Kan ayaa kaydinaya xogta
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Soo qaadashada xogta
            const name = document.getElementById('regName').value;
            const user = document.getElementById('regUser').value.trim(); // Kani waa muhiim
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const gender = document.getElementById('regGender').value;
            const pass = document.getElementById('regPass').value;
            const profileImg = document.getElementById('preview').src;

            // KAYDINTA XOGTA (Waa in magacyadu la mid noqdaan kuwa Login-ka)
            localStorage.setItem('savedUser', user);
            localStorage.setItem('savedPass', pass);
            localStorage.setItem('studentName', name);
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPhone', phone);
            localStorage.setItem('userGender', gender);
            localStorage.setItem('userProfile', profileImg);

            // SweetAlert
            Swal.fire({
                title: 'Hambalyo!',
                text: 'Akoon waa la abuuray. Hadda gal (Login).',
                icon: 'success',
                confirmButtonColor: '#28a745',
                confirmButtonText: 'OK'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = 'index.html'; // Ku noqo bogga Login-ka
                }
            });
        });
    </script>
</body>

</html>
