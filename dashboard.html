<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 8 Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body style="display: block; padding: 20px;">

    <!-- Profile Section (Tixraac: 107621.jpg) -->
    <div class="profile-header" style="text-align: center; margin-bottom: 30px;">
        <img src="107621.jpg" alt="Profile"
            style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary-green);">
        <h3 id="userNameDisplay">Arday</h3>
        <p style="color: #666;">Developed for Grade 8 Students</p>
    </div>

    <h2 style="text-align: center;">Learning Materials</h2>

    <!-- Grid-ka Maadooyinka (Tixraac: 107628.jpg) -->
    <div class="menu-grid" style="display: grid; gap: 15px;">

        <div class="card-link" onclick="showCategory('pdfs')"
            style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer;">
            <i class="fas fa-book-open"></i>
            <h3>MAADOOYINKA PDF</h3>
        </div>

        <div class="card-link" onclick="showCategory('q-a')"
            style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer;">
            <i class="fas fa-question-circle"></i>
            <h3>MAADOOYINKA SU'AALO IYO JAWAABO</h3>
        </div>

        <div class="card-link" onclick="showCategory('exams')"
            style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 30px; border-radius: 15px; text-align: center; cursor: pointer;">
            <i class="fas fa-file-alt"></i>
            <h3>IMTIXAANKA DOWLADDA</h3>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
