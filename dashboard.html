<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 8 Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #28a745;
            --sidebar-width: 260px;
            --bg-light: #f4f7f6;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            display: flex;
        }

        /* --- SIDEBAR STYLE --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #2c3e50;
            height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar-menu li:hover {
            background: var(--primary-green);
        }

        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
        }

        /* --- MAIN CONTENT STYLE --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 20px;
            transition: all 0.3s ease;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: none;
            /* Kaliya Mobile-ka ayaa laga arki doonaa */
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            justify-content: space-between;
            align-items: center;
            margin: -20px -20px 20px -20px;
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            color: var(--dark-gray);
        }

        /* Profile Style */
        .profile-header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary-green);
            object-fit: cover;
        }

        /* Grid for Cards */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card-link {
            transition: transform 0.3s ease;
        }

        .card-link:hover {
            transform: translateY(-5px);
        }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 768px) {
            .sidebar {
                left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .top-nav {
                display: flex;
            }

            .overlay.active {
                display: block;
            }

            .close-sidebar {
                display: block !important;
            }
        }

        .close-sidebar {
            display: none;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-user-graduate"></i> National Books</h3>
            <i class="fas fa-times close-sidebar" onclick="toggleSidebar()"></i>
        </div>
        <ul class="sidebar-menu">
            <li onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</li>
            <li onclick="showCategory('pdfs')"><i class="fas fa-book"></i> Buugaagta PDF</li>
            <li onclick="showCategory('exams')"><i class="fas fa-pen-alt"></i> Imtixaannada</li>
            <li onclick="showCategory('q-a')"><i class="fas fa-comments"></i> Q&A Section</li>
            <li style="margin-top: auto; background: #c0392b;" onclick="logout()"><i class="fas fa-sign-out-alt"></i>
                Kabax (Logout)</li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Nav for Mobile -->
        <div class="top-nav">
            <div class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <h4 style="margin:0;">Manhajka Qaranka</h4>
            <div style="width: 24px;"></div> <!-- Spacer -->
        </div>

        <!-- Profile Section -->
        <div class="profile-header" style="text-align: center; margin-bottom: 30px;">
            <!-- ID-gan 'userProfileImage' wuxuu ka imaanayaa app.js -->
            <img id="userProfileImage" src="107621.jpg" alt="Profile">
            <h3 id="userNameDisplay">Arday</h3>
            <p style="color: #666;">Ardayda Soomaaliyeed</p>
        </div>

        <h2 style="text-align: center;">Learning Materials</h2>

        <!-- Grid-ka Maadooyinka -->
        <div class="menu-grid">
            <div class="card-link" onclick="showCategory('pdfs')"
                style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 40px 20px; border-radius: 15px; text-align: center; cursor: pointer;">
                <i class="fas fa-book-open" style="font-size: 40px; margin-bottom: 15px;"></i>
                <h3>MAADOOYINKA PDF</h3>
            </div>

            <div class="card-link" onclick="showCategory('q-a')"
                style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 20px; border-radius: 15px; text-align: center; cursor: pointer;">
                <i class="fas fa-question-circle" style="font-size: 40px; margin-bottom: 15px;"></i>
                <h3>MAADOOYINKA SU'AALO IYO JAWAABO</h3>
            </div>

            <div class="card-link" onclick="showCategory('exams')"
                style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 40px 20px; border-radius: 15px; text-align: center; cursor: pointer;">
                <i class="fas fa-file-alt" style="font-size: 40px; margin-bottom: 15px;"></i>
                <h3>IMTIXAANKA DOWLADDA</h3>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function logout() {
            // Tirtir xogta session-ka haddii aad rabto
            window.location.href = 'index.html';
        }
    </script>
    <script src="js/app.js"></script>
</body>

</html>
