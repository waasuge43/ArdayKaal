<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imtixaannada - Manhajka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --theme-purple: #764ba2;
            --theme-orange: #e67e22;
            --bg-light: #f8f9fa;
            --primary-green: #28a745;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex !important;
            align-items: stretch !important;
            min-height: 100vh;
        }

        /* --- SIDEBAR STYLE --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #2c3e50;
            height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar-menu li:hover {
            background: var(--primary-green);
        }

        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
        }

        .sidebar-social {
            margin-top: auto;
            background: #1a252f;
            padding: 20px 10px;
            text-align: center;
            border-top: 1px solid #34495e;
        }

        .sidebar-social p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #aaa;
        }

        .sidebar-social a {
            display: inline-block;
            margin: 0 10px;
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .sidebar-social a:hover {
            transform: translateY(-3px);
        }

        .icon-whatsapp {
            color: #25D366;
        }

        .icon-facebook {
            color: #1877F2;
        }

        .icon-tiktok {
            color: #ffffff;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 20px;
            transition: all 0.3s ease;
            width: 100%;
            display: block !important;
            box-sizing: border-box;
            text-align: center;
        }

        .top-nav {
            display: none;
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            justify-content: space-between;
            align-items: center;
            margin: -20px -20px 20px -20px;
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .close-sidebar {
            display: none;
            font-size: 20px;
            cursor: pointer;
        }

        .header-section {
            margin-bottom: 30px;
        }

        .header-section h1 {
            color: var(--theme-orange);
        }

        .exams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .exam-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
            cursor: pointer;
            border-left: 5px solid var(--theme-orange);
        }

        .exam-icon {
            font-size: 35px;
            color: var(--theme-orange);
            background: #fff3e0;
            padding: 15px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        .exam-info {
            text-align: left;
        }

        .exam-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #333;
        }

        .exam-info p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .btn-back {
            margin-top: 30px;
            padding: 10px 25px;
            background: var(--theme-purple);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .sidebar {
                left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .top-nav {
                display: flex;
            }

            .overlay.active {
                display: block;
            }

            .close-sidebar {
                display: block !important;
            }

            .exams-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-user-graduate"></i> Manhajka Qaranka</h3>
            <i class="fas fa-times close-sidebar" onclick="toggleSidebar()"></i>
        </div>
        <ul class="sidebar-menu">
            <li onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</li>
            <li onclick="window.location.href='books.html'"><i class="fas fa-book"></i> Buugaagta PDF</li>
            <li onclick="window.location.href='q-a.html'"><i class="fas fa-comments"></i> Su'aalo & Jawaabo</li>
            <li style="background: var(--theme-orange);"><i class="fas fa-pen-alt"></i> Imtixaannada</li>
            <li style="margin-top: auto;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Kabax (Logout)</li>
        </ul>
        <div class="sidebar-social">
            <p>Ila soo Xiriir</p>
            <a href="https://wa.me/+252618903797" class="icon-whatsapp" target="_blank"><i
                    class="fab fa-whatsapp"></i></a>
            <a href="#" class="icon-facebook" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="#" class="icon-tiktok" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </nav>

    <div class="main-content">
        <div class="top-nav">
            <div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
            <h4 style="margin:0; color: var(--theme-orange);"><i class="fas fa-pen-alt"></i> Imtixaannada</h4>
            <div style="width: 24px;"></div>
        </div>

        <div class="header-section">
            <h1 id="gradeTitle">Imtixaannadii Hore</h1>
            <p id="gradeDesc">Dooro sanadka aad rabto inaad aragto imtixaankiisa.</p>
        </div>

        <div class="exams-grid" id="examsContainer"></div>

        <button onclick="window.location.href='dashboard.html'" class="btn-back" id="backBtn">
            <i class="fas fa-arrow-left"></i> Dib u laabo Dashboard
        </button>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // List-ka sanadaha oo dhan
        const availableYears = [
            { year: "2024-2025", desc: "Su'aalihii ugu dambeeyay ee dowladda", icon: "fa-award" },
            { year: "2023-2024", desc: "Imtixaankii Shahaadiga ee sanadkii hore", icon: "fa-calendar-check" },
            { year: "2022-2023", desc: "Kaydka imtixaannada dowladda", icon: "fa-file-pdf" },
            { year: "2021-2022", desc: "Kaydka imtixaannada dowladda", icon: "fa-history" },
            { year: "2020-2021", desc: "Kaydka imtixaannada dowladda", icon: "fa-history" }
        ];

        // 1. Soo bandhig Sanadaha marka hore (Laba tixgelin fasal ma jirto)
        function loadYears() {
            const container = document.getElementById('examsContainer');
            document.getElementById('gradeTitle').innerHTML = `Imtixaannadii Hore`;
            document.getElementById('gradeDesc').innerText = `Dooro sanadka aad rabto inaad aragto imtixaankiisa.`;
            document.getElementById('backBtn').onclick = () => window.location.href = 'dashboard.html';

            container.innerHTML = "";
            availableYears.forEach(item => {
                container.innerHTML += `
                    <div class="exam-card" onclick="showGradeSelection('${item.year}')">
                        <div class="exam-icon"><i class="fas ${item.icon}"></i></div>
                        <div class="exam-info">
                            <h3>Sanadka ${item.year}</h3>
                            <p>${item.desc}</p>
                        </div>
                    </div>
                `;
            });
        }

        // 2. Dooro Fasalka (8 ama 12)
        function showGradeSelection(year) {
            const container = document.getElementById('examsContainer');
            document.getElementById('gradeTitle').innerHTML = `<i class="fas fa-layer-group"></i> Fasallada (${year})`;
            document.getElementById('gradeDesc').innerText = `Dooro fasalka aad rabto inaad imtixaankiisa aragto.`;

            // Badhanka dib u laabashada hadda wuxuu ku celinayaa sanadaha
            document.getElementById('backBtn').onclick = loadYears;

            container.innerHTML = `
                <div class="exam-card" onclick="showStateSelection('${year}')">
                    <div class="exam-icon"><i class="fas fa-user-graduate"></i></div>
                    <div class="exam-info">
                        <h3>Fasalka 8aad</h3>
                        <p>Imtixaanka Shahaadiga ee Gobollada - ${year}</p>
                    </div>
                </div>
                <div class="exam-card" onclick="openBook('g12_exam_${year.replace("-", "_")}.pdf', 'Imtixaan Grade 12 ${year}')">
                    <div class="exam-icon"><i class="fas fa-graduation-cap"></i></div>
                    <div class="exam-info">
                        <h3>Fasalka 12aad</h3>
                        <p>Imtixaanka Shahaadiga ee Qaranka - ${year}</p>
                    </div>
                </div>
            `;
        }

        // 3. Dooro Gobolka (Kaliya Fasalka 8aad)
        function showStateSelection(year) {
            const container = document.getElementById('examsContainer');
            document.getElementById('gradeTitle').innerHTML = `<i class="fas fa-map-marked-alt"></i> Gobollada (${year})`;
            document.getElementById('gradeDesc').innerText = `Dooro dowlad goboleedka aad rabto imtixaankiisa fasalka 8aad.`;

            document.getElementById('backBtn').onclick = () => showGradeSelection(year);

            const states = [
                { name: "Banaadir", suffix: "banadir" },
                { name: "Hirshabelle", suffix: "hirshabelle" },
                { name: "Galmudug", suffix: "galmudug" },
                { name: "Jubbaland", suffix: "jubbaland" }
            ];

            container.innerHTML = "";
            states.forEach(state => {
                // Magaca faylka wuxuu noqonayaa tusaale: banadir_g8_2024_2025.pdf
                const fileName = `${state.suffix}_g8_${year.replace("-", "_")}.pdf`;
                container.innerHTML += `
                    <div class="exam-card" onclick="openBook('${fileName}', 'G8 ${state.name} ${year}')">
                        <div class="exam-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="exam-info">
                            <h3>${state.name}</h3>
                            <p>Riix si aad u aragto imtixaanka ${state.name} (${year})</p>
                        </div>
                    </div>
                `;
            });
        }

        function openBook(file, name) {
            window.location.href = `view-pdf.html?file=${encodeURIComponent(file)}&name=${encodeURIComponent(name)}`;
        }

        window.onload = loadYears;
    </script>
</body>

</html>
