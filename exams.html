<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imtixaannada - Manhajka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --theme-purple: #764ba2;
            --theme-orange: #e67e22;
            /* Midab gaar u ah imtixaanka */
            --bg-light: #f8f9fa;
            --primary-green: #28a745;
            --sidebar-width: 260px;
        }

        /* Xallinta is-dhex-galka & Flexbox-ka Sidebar-ka */
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex !important;
            align-items: stretch !important;
            min-height: 100vh;
        }

        /* --- SIDEBAR STYLE --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #2c3e50;
            height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar-menu li:hover {
            background: var(--primary-green);
        }

        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
        }

        .sidebar-social {
            margin-top: auto;
            background: #1a252f;
            padding: 20px 10px;
            text-align: center;
            border-top: 1px solid #34495e;
        }

        .sidebar-social p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #aaa;
        }

        .sidebar-social a {
            display: inline-block;
            margin: 0 10px;
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .sidebar-social a:hover {
            transform: translateY(-3px);
        }

        .icon-whatsapp {
            color: #25D366;
        }

        .icon-facebook {
            color: #1877F2;
        }

        .icon-tiktok {
            color: #ffffff;
        }

        /* --- MAIN CONTENT & MOBILE NAV --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 20px;
            transition: all 0.3s ease;
            width: 100%;
            display: block !important;
            box-sizing: border-box;
            text-align: center;
        }

        .top-nav {
            display: none;
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            justify-content: space-between;
            align-items: center;
            margin: -20px -20px 20px -20px;
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .close-sidebar {
            display: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* --- EXAMS STYLE --- */
        .header-section {
            margin-bottom: 30px;
        }

        .header-section h1 {
            color: var(--theme-orange);
        }

        .exams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .exam-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
            cursor: pointer;
            border-left: 5px solid var(--theme-orange);
        }

        .exam-icon {
            font-size: 35px;
            color: var(--theme-orange);
            background: #fff3e0;
            /* Midab khafiif ah oo orange ah */
            padding: 15px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        .exam-info {
            text-align: left;
            /* Qoraalka dhanka bidix ayuu xigaa */
        }

        .exam-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #333;
        }

        .exam-info p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .exam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .btn-back {
            margin-top: 30px;
            padding: 10px 25px;
            background: var(--theme-purple);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
        }

        /* --- RESPONSIVE DESIGN FOR SMALL SCREENS --- */
        @media (max-width: 768px) {
            .sidebar {
                left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .top-nav {
                display: flex;
            }

            .overlay.active {
                display: block;
            }

            .close-sidebar {
                display: block !important;
            }

            .exams-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-user-graduate"></i> Manhajka Qaranka</h3>
            <i class="fas fa-times close-sidebar" onclick="toggleSidebar()"></i>
        </div>
        <ul class="sidebar-menu">
            <li onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</li>
            <li onclick="window.location.href='books.html'"><i class="fas fa-book"></i> Buugaagta PDF</li>
            <li onclick="window.location.href='q-a.html'"><i class="fas fa-comments"></i> Su'aalo & Jawaabo</li>
            <li style="background: var(--theme-orange);"><i class="fas fa-pen-alt"></i> Imtixaannada</li>
            <li style="margin-top: auto;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Kabax (Logout)</li>
        </ul>

        <!-- Qaybta Xiriirka (Social Media Contacts) -->
        <div class="sidebar-social">
            <p>Ila soo Xiriir</p>
            <a href="https://wa.me/+252618903797" class="icon-whatsapp" target="_blank" title="WhatsApp"><i
                    class="fab fa-whatsapp"></i></a>
            <a href="#" class="icon-facebook" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" class="icon-tiktok" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
    </nav>

    <!-- Main Content Box -->
    <div class="main-content">
        <!-- Top Nav for Mobile -->
        <div class="top-nav">
            <div class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <h4 style="margin:0; color: var(--theme-orange);"><i class="fas fa-pen-alt"></i> Imtixaannada</h4>
            <div style="width: 24px;"></div> <!-- Spacer -->
        </div>

        <div class="header-section">
            <h1 id="gradeTitle">Imtixaannadii Hore</h1>
            <p>Daalaco imtixaanaadkii dowladda ee sanadihii lasoo dhaafay si aad isugu diyaariso.</p>
        </div>

        <!-- Halkan waxaa ku soo dhacaya imtixaannada iskiis (Dynamic) -->
        <div class="exams-grid" id="examsContainer"></div>

        <button onclick="window.location.href='dashboard.html'" class="btn-back">
            <i class="fas fa-arrow-left"></i> Dib u laabo Dashboard
        </button>
    </div>

    <script>
        // Fur/Xir Sidebar-ka Mobile-ka
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // 1. Hel fasalka uu ardaygu soo doortay
        const selectedGrade = localStorage.getItem('selectedGrade') || "8";
        document.getElementById('gradeTitle').innerHTML = `<i class="fas fa-file-signature"></i> Imtixaannada Fasalka ${selectedGrade}`;

        // 2. Database-ka Imtixaannada (Dynamic Logic)
        const examsData = {
            "6": [
                { year: "2024-2025", title: "Imtixaanka Dowladda (Curriculum Cusub)", icon: "fa-award", file: "g8_exam_24_25.pdf", desc: "Su'aalihii ugu dambeeyay ee dowladda" },
                { year: "2023-2024", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_23_24.pdf", desc: "Dhammaan maadooyinka" },
                { year: "2022-2023", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_22_23.pdf", desc: "Dhammaan maadooyinka" },
                { year: "2021-2022", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_21_22.pdf", desc: "Dhammaan maadooyinka" },
                { year: "2020-2021", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_20_21.pdf", desc: "Dhammaan maadooyinka" }
            ],
            "8": [
                { year: "2024-2025", title: "Imtixaanka Dowladda (Curriculum Cusub)", icon: "fa-award", file: "g8_exam_24_25.pdf", desc: "Su'aalihii ugu dambeeyay ee dowladda" },
                { year: "2023-2024", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_23_24.pdf", desc: "Dhammaan maadooyinka" },
                { year: "2022-2023", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_22_23.pdf", desc: "Dhammaan maadooyinka" },
                { year: "2021-2022", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_21_22.pdf", desc: "Dhammaan maadooyinka" },
                { year: "2020-2021", title: "Imtixaanka Dowladda", icon: "fa-file-pdf", file: "g8_exam_20_21.pdf", desc: "Dhammaan maadooyinka" }
            ],
            "12": [
                { year: "2024-2025", title: "Shahaadiga Dugsiga Sare", icon: "fa-award", file: "g12_exam_24_25.pdf", desc: "Su'aalihii ugu dambeeyay ee dowladda" },
                { year: "2023-2024", title: "Shahaadiga Dugsiga Sare", icon: "fa-file-pdf", file: "g12_exam_23_24.pdf", desc: "Saynis & Atis (Dhammaan)" },
                { year: "2022-2023", title: "Shahaadiga Dugsiga Sare", icon: "fa-file-pdf", file: "g12_exam_22_23.pdf", desc: "Saynis & Atis (Dhammaan)" },
                { year: "2021-2022", title: "Shahaadiga Dugsiga Sare", icon: "fa-file-pdf", file: "g12_exam_21_22.pdf", desc: "Saynis & Atis (Dhammaan)" },
                { year: "2020-2021", title: "Shahaadiga Dugsiga Sare", icon: "fa-file-pdf", file: "g12_exam_20_21.pdf", desc: "Saynis & Atis (Dhammaan)" }
            ]
        };

        // 3. Logic-ga soo bandhigista
        function loadExams() {
            const container = document.getElementById('examsContainer');
            // Haddii fasalka la doortay uusan ahayn 8 ama 12, waxaan tusaynaa farriin, ama waxaad ku dari kartaa imtixaano dugsi.
            const exams = examsData[selectedGrade] || [];

            if (exams.length === 0) {
                container.innerHTML = `<p style="grid-column: 1 / -1; color: #666; padding: 20px;">Wali laguma soo darin imtixaannada fasalkan. Fadlan dib u eeg fasallada 8aad ama 12aad.</p>`;
                return;
            }

            exams.forEach(exam => {
                const card = `
                    <div class="exam-card" onclick="openBook('${exam.file}', 'Imtixaan ${exam.year}')">
                        <div class="exam-icon"><i class="fas ${exam.icon}"></i></div>
                        <div class="exam-info">
                            <h3>Sanadka ${exam.year}</h3>
                            <p>${exam.title} - ${exam.desc}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 4. Function-ka fura imtixaanka (Wuxuu isticmaalayaa isla PDF Viewer-kii hore)
        function openBook(file, name) {
            window.location.href = `view-pdf.html?file=${encodeURIComponent(file)}&name=${encodeURIComponent(name)}`;
        }

        // Daari shaqada marka boggu kaco
        window.onload = loadExams;
    </script>
</body>

</html>
