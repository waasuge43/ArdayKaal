<!DOCTYPE html>
<html lang="so">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A - Grade Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --qa-purple: #764ba2;
            --bg-light: #f8f9fa;
            --primary-green: #28a745;
            --sidebar-width: 260px;
        }

        /* Xallinta is-dhex-galka (Override style.css) */
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            display: flex !important;
            /* Waxay u baahan tahay flex si sidebar-ka u shaqeeyo */
            align-items: stretch !important;
            min-height: 100vh;
        }

        /* --- SIDEBAR STYLE (Laga keenay Dashboard) --- */
        .sidebar {
            width: var(--sidebar-width);
            background: #2c3e50;
            height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #1a252f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            padding: 15px 20px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar-menu li:hover {
            background: var(--primary-green);
        }

        .sidebar-menu i {
            margin-right: 10px;
            width: 20px;
        }

        /* Qaybta Xiriirka (Social Media) */
        .sidebar-social {
            margin-top: auto;
            background: #1a252f;
            padding: 20px 10px;
            text-align: center;
            border-top: 1px solid #34495e;
        }

        .sidebar-social p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #aaa;
        }

        .sidebar-social a {
            display: inline-block;
            margin: 0 10px;
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .sidebar-social a:hover {
            transform: translateY(-3px);
        }

        .icon-whatsapp {
            color: #25D366;
        }

        .icon-facebook {
            color: #1877F2;
        }

        .icon-tiktok {
            color: #ffffff;
        }

        /* --- MAIN CONTENT & MOBILE NAV --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 20px;
            transition: all 0.3s ease;
            width: 100%;
            display: block !important;
            /* Si uusan u squish-garoobin */
            box-sizing: border-box;
        }

        .top-nav {
            display: none;
            background: white;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            justify-content: space-between;
            align-items: center;
            margin: -20px -20px 20px -20px;
        }

        .menu-btn {
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .close-sidebar {
            display: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* --- Q&A STYLES (Koodhkaagii Asalka Ahaa) --- */
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h1 {
            color: var(--qa-purple);
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #666;
            font-weight: bold;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .qa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .qa-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
            cursor: pointer;
            border-left: 5px solid var(--qa-purple);
        }

        .qa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .qa-icon {
            font-size: 35px;
            color: var(--qa-purple);
            background: #f0ebf8;
            padding: 15px;
            border-radius: 12px;
            min-width: 65px;
            text-align: center;
        }

        .qa-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: #333;
        }

        .qa-info p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        /* --- RESPONSIVE DESIGN FOR SMALL SCREENS --- */
        @media (max-width: 768px) {
            .sidebar {
                left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .top-nav {
                display: flex;
            }

            .overlay.active {
                display: block;
            }

            .close-sidebar {
                display: block !important;
            }

            .qa-grid {
                grid-template-columns: 1fr;
            }

            /* Hal saf ayuu noqonayaa Mobile-ka */
            .back-btn {
                display: none;
            }

            /* Mobile-ka hamburger menu ayaa la isticmaalayaa */
        }
    </style>
</head>

<body>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-user-graduate"></i> Manhajka Qaranka</h3>
            <i class="fas fa-times close-sidebar" onclick="toggleSidebar()"></i>
        </div>
        <ul class="sidebar-menu">
            <li onclick="window.location.href='dashboard.html'"><i class="fas fa-home"></i> Dashboard</li>
            <li onclick="window.location.href='books.html'"><i class="fas fa-book"></i> Buugaagta PDF</li>
            <li style="background: var(--qa-purple);"><i class="fas fa-comments"></i> Su'aalo & Jawaabo</li>
            <li onclick="window.location.href='exams.html'"><i class="fas fa-pen-alt"></i> Imtixaannada</li>
            <!-- <hr> -->
            <li style="margin-top: auto;" onclick="logout()"><i class="fas fa-sign-out-alt"></i>
                Kabax (Logout)</li>
        </ul>

        <!-- Qaybta Xiriirka (Social Media Contacts) -->
        <div class="sidebar-social">
            <p>Ila soo Xiriir</p>
            <!-- Beddel # meelahaas linkiyadaada rasmiga ah geli -->
            <a href="https://wa.me/+252618903797" class="icon-whatsapp" target="_blank" title="WhatsApp"><i
                    class="fab fa-whatsapp"></i></a>
            <a href="#" class="icon-facebook" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="#" class="icon-tiktok" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
    </nav>

    <!-- Main Content Box -->
    <div class="main-content">
        <!-- Top Nav for Mobile -->
        <div class="top-nav">
            <div class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </div>
            <h4 style="margin:0; color: var(--qa-purple);"><i class="fas fa-question-circle"></i> Q&A Hub</h4>
            <div style="width: 24px;"></div> <!-- Spacer -->
        </div>

        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Dib u noqo Dashboard</a>

        <div class="header-section">
            <h1 id="qaTitle"><i class="fas fa-question-circle"></i> Su'aalaha iyo Jawaabaha</h1>
            <p>Dooro maadada aad rabto inaad akhriso su'aalaheeda</p>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Raadi maado (Tusaale: English)..." onkeyup="filterQA()">
        </div>

        <!-- Halkan waxaa si Dynamic ah ugu soo dhacaya su'aalaha -->
        <div class="qa-grid" id="qaList">

        </div>
    </div>

    <script>
        // Fur/Xir Sidebar-ka Mobile-ka
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // Hel fasalka uu ardaygu soo doortay (LocalStorage)
        const selectedGrade = localStorage.getItem('selectedGrade') || "8";
        document.getElementById('qaTitle').innerHTML = `<i class="fas fa-question-circle"></i> Su'aalaha Fasalka ${selectedGrade}`;

        // Database-ka Su'aalaha & Jawaabaha ee Fasallada
        const qaData = {
            "6": [
                { name: "Tarbiyo", icon: "fa-mosque", file: "g6_tarbiyo_qa.pdf", desc: "Su'aalo iyo Jawaabo dhammaystiran" },
                { name: "Social Science", icon: "fa-users", file: "g6_social_qa.pdf", desc: "Su'aalaha Taariikhda & Juqraafiga" },
                { name: "Science", icon: "fa-flask", file: "g6_science_qa.pdf", desc: "Su'aalaha muhiimka ah ee sanadka" }
            ],
            "7": [
                { name: "Chemistry", icon: "fa-vial", file: "g7_chem_qa.pdf", desc: "Su'aalaha Kimistariga" },
                { name: "Physics", icon: "fa-bolt", file: "g7_phys_qa.pdf", desc: "Su'aalaha Fiisigiska" },
                { name: "Biology", icon: "fa-leaf", file: "g7_bio_qa.pdf", desc: "Su'aalaha Bayoolojiga" },
                { name: "Math", icon: "fa-calculator", file: "g7_math_qa.pdf", desc: "Su'aalaha Xisaabta" },
                { name: "Technology", icon: "fa-microchip", file: "g7_tech_qa.pdf", desc: "Su'aalaha Tiknoolajiyadda" },
                { name: "Business", icon: "fa-chart-line", file: "g7_business_qa.pdf", desc: "Su'aalaha Ganacsiga" }
            ],
            "8": [
                { name: "Tarbiyo Islaami", icon: "fa-mosque", file: "islamic_qa.pdf", desc: "Su'aalo iyo Jawaabo dhammaystiran" },
                { name: "Xisaab (Math)", icon: "fa-calculator", file: "math_qa.pdf", desc: "Su'aalaha Cutubyada 1-8" },
                { name: "Saynis (Science)", icon: "fa-flask", file: "science_qa.pdf", desc: "Su'aalaha muhiimka ah ee sanadka" },
                { name: "English Language", icon: "fa-language", file: "english_qa.pdf", desc: "Grammar and Vocabulary Questions" }
            ],
            "9": [
                { name: "Chemistry", icon: "fa-vial", file: "g9_chem_qa.pdf", desc: "Su'aalaha Kimistariga" },
                { name: "Physics", icon: "fa-bolt", file: "g9_phys_qa.pdf", desc: "Su'aalaha Fiisigiska" },
                { name: "Math", icon: "fa-square-root-alt", file: "g9_math_qa.pdf", desc: "Su'aalaha Xisaabta" }
            ],
            "10": [
                { name: "Chemistry", icon: "fa-vial", file: "g10_chem_qa.pdf", desc: "Su'aalaha Kimistariga" },
                { name: "Physics", icon: "fa-atom", file: "g10_phys_qa.pdf", desc: "Su'aalaha Fiisigiska" },
                { name: "Biology", icon: "fa-dna", file: "g10_bio_qa.pdf", desc: "Su'aalaha Bayoolojiga" }
            ],
            "11": [
                { name: "Chemistry", icon: "fa-flask", file: "g11_chem_qa.pdf", desc: "Su'aalaha Kimistariga" },
                { name: "Physics", icon: "fa-bolt", file: "g11_phys_qa.pdf", desc: "Su'aalaha Fiisigiska" },
                { name: "Math", icon: "fa-calculator", file: "g11_math_qa.pdf", desc: "Su'aalaha Xisaabta" }
            ],
            "12": [
                { name: "Biology", icon: "fa-dna", file: "g12_bio_qa.pdf", desc: "Su'aalaha Bayoolojiga" },
                { name: "Physics", icon: "fa-atom", file: "g12_phys_qa.pdf", desc: "Su'aalaha Fiisigiska" },
                { name: "Chemistry", icon: "fa-vial", file: "g12_chem_qa.pdf", desc: "Su'aalaha Kimistariga" },
                { name: "English", icon: "fa-book", file: "g12_eng_qa.pdf", desc: "Su'aalaha Ingiriisiga" },
                { name: "Soomaali", icon: "fas fa-pen-nib", file: "g12_soom_qa.pdf", desc: "Su'aalaha Afsoomaaliga" }
            ]
        };

        // Function-ka soo daabacaya su'aalaha fasalka la doortay
        function loadQA() {
            const container = document.getElementById('qaList');
            const qas = qaData[selectedGrade] || [];

            container.innerHTML = ""; // Nadiifi meesha inta aysan wax soo saarin

            if (qas.length === 0) {
                container.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #666;">Wali laguma darin su'aalaha fasalkan.</p>`;
                return;
            }

            qas.forEach(qa => {
                const card = `
                    <div class="qa-card" onclick="openBook('${qa.file}', '${qa.name} Q&A')">
                        <div class="qa-icon"><i class="fas ${qa.icon}"></i></div>
                        <div class="qa-info">
                            <h3>${qa.name}</h3>
                            <p>${qa.desc}</p>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Function-ka raadinta (Search) ee asalka ahaa
        function filterQA() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('qa-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        // Function-ka fura buugga
        function openBook(fileName, displayName) {
            const file = encodeURIComponent(fileName);
            const name = encodeURIComponent(displayName);
            window.location.href = `view-pdf.html?file=${file}&name=${name}`;
        }

        // Daar shaqada markuu boggu kaco
        window.onload = loadQA;
    </script>
</body>

</html>
